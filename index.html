<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon — Study Command Center</title>

<style>
:root{
  --ink:#171717;
  --cream:#f6f0e4;
  --gold:#e6b84a;
  --gold-deep:#b88920;
  --orange:#e47b35;
  --orange-deep:#b9541d;
  --blue:#163d63;
  --blue-deep:#0d2944;
  --pink:#d96b82;
  --white:#fffdf8;
  --muted:#777;
  --radius:22px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#ddd7ca;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:var(--cream);
  position:relative;
  padding-bottom:90px;
  box-shadow:0 0 30px rgba(0,0,0,.12);
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 20px 12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo{
  width:34px;
  height:34px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:2px solid var(--ink);
  background:var(--white);
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:18px;
  transition:.15s;
}

.icon-btn:active{
  transform:scale(.94);
}

/* HERO */

.hero{
  padding:15px 20px 20px;
}

.hero h1{
  font-size:38px;
  line-height:1;
  letter-spacing:-2px;
  max-width:350px;
}

.hero p{
  margin-top:9px;
  font-size:14px;
  font-weight:700;
  color:#555;
}

.search{
  margin-top:18px;
  width:100%;
  border:2px solid var(--ink);
  background:var(--white);
  border-radius:15px;
  padding:13px 15px;
  outline:none;
}

.search:focus{
  box-shadow:4px 4px 0 var(--gold);
}

/* OUTLAYER */

.section{
  padding:0 20px 20px;
}

.section-title{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:10px;
}

.pills{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.pills::-webkit-scrollbar{
  display:none;
}

.pill{
  white-space:nowrap;
  border:2px solid var(--ink);
  background:var(--white);
  padding:9px 15px;
  border-radius:30px;
  font-weight:800;
}

.pill.active{
  background:var(--ink);
  color:white;
}

/* MAIN CARD */

.command-card{
  margin:0 20px 20px;
  background:var(--blue);
  color:white;
  border-radius:var(--radius);
  padding:20px;
  box-shadow:6px 6px 0 var(--blue-deep);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.card-label{
  font-size:11px;
  font-weight:900;
  letter-spacing:1.7px;
  text-transform:uppercase;
  opacity:.7;
}

.add-btn{
  border:2px solid white;
  color:white;
  background:transparent;
  border-radius:12px;
  padding:7px 11px;
  font-weight:900;
}

.add-btn:active{
  transform:scale(.95);
}

.card-title{
  margin-top:8px;
  font-size:25px;
  font-weight:900;
}

/* PROGRESS */

.progress-area{
  margin-top:18px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
}

.progress-bar{
  width:100%;
  height:9px;
  background:rgba(255,255,255,.2);
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:var(--gold);
  border-radius:10px;
  transition:.3s;
}

/* ITEMS */

.items{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.item{
  background:var(--white);
  color:var(--ink);
  border-radius:15px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.check{
  width:23px;
  height:23px;
  flex:none;
  border:2px solid var(--ink);
  border-radius:7px;
  background:white;
  display:grid;
  place-items:center;
  font-size:14px;
  font-weight:900;
}

.item.completed .check{
  background:var(--gold);
}

.item.completed .item-text{
  text-decoration:line-through;
  opacity:.5;
}

.item-content{
  min-width:0;
  flex:1;
}

.item-text{
  font-weight:800;
  overflow-wrap:anywhere;
}

.item-meta{
  font-size:11px;
  color:#777;
  margin-top:3px;
}

.delete{
  border:0;
  background:transparent;
  font-size:17px;
  padding:5px;
  color:#888;
}

/* NOTE */

.note-item{
  display:block;
}

.note-title{
  font-weight:900;
  font-size:16px;
}

.note-body{
  margin-top:6px;
  white-space:pre-wrap;
  color:#555;
  font-size:13px;
  line-height:1.4;
}

/* GOAL */

.goal-item{
  display:block;
}

.goal-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:900;
}

.goal-slider{
  width:100%;
  margin-top:12px;
  accent-color:var(--orange);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:25px 10px;
  opacity:.65;
  font-size:13px;
  font-weight:700;
}

/* STATS */

.stats{
  padding:0 20px 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.stat{
  background:var(--white);
  border:2px solid var(--ink);
  border-radius:16px;
  padding:13px 10px;
}

.stat-number{
  font-size:24px;
  font-weight:900;
}

.stat-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:#777;
  margin-top:3px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  background:var(--white);
  border-top:2px solid var(--ink);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  z-index:10;
}

.nav-btn{
  border:0;
  background:transparent;
  padding:7px 3px;
  border-radius:12px;
  font-size:11px;
  font-weight:900;
}

.nav-icon{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.nav-btn.active{
  background:var(--ink);
  color:white;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  background:var(--cream);
  border-radius:25px 25px 0 0;
  padding:22px;
  animation:slideUp .2s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.modal-box h2{
  font-size:24px;
  margin-bottom:15px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  border:2px solid var(--ink);
  border-radius:13px;
  background:white;
  padding:12px;
  outline:none;
}

.form textarea{
  min-height:110px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:9px;
  margin-top:5px;
}

.form-actions button{
  flex:1;
  border:2px solid var(--ink);
  border-radius:13px;
  padding:12px;
  font-weight:900;
}

.cancel{
  background:white;
}

.save{
  background:var(--ink);
  color:white;
}

/* MOBILE */

@media(max-width:480px){
  body{
    background:var(--cream);
  }

  .app{
    box-shadow:none;
  }

  .hero h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" fill="none">
      <rect x="3" y="3" width="34" height="34" rx="10" fill="#E6B84A" stroke="#171717" stroke-width="3"/>
      <path d="M12 27L20 11L28 27" stroke="#171717" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 22H25" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    </svg>
    Archon
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="clearSearch">⌕</button>
    <button class="icon-btn" id="quickAdd">＋</button>
  </div>
</header>


<section class="hero">
  <h1>Your Study Command Center</h1>
  <p>Organise. Focus. Execute.</p>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search everything..."
  >
</section>


<section class="section">
  <div class="section-title">Outlayer.</div>

  <div class="pills">
    <button class="pill active" data-section="tasks">Tasks</button>
    <button class="pill" data-section="notes">Notes</button>
    <button class="pill" data-section="next">Next</button>
    <button class="pill" data-section="goals">Goals</button>
  </div>
</section>


<section class="command-card">

  <div class="card-top">
    <div class="card-label" id="cardLabel">Today's Task</div>
    <button class="add-btn" id="addButton">+ Add</button>
  </div>

  <div class="card-title" id="cardTitle">
    Execute your priorities.
  </div>

  <div class="progress-area">
    <div class="progress-info">
      <span id="progressText">0% complete</span>
      <span id="progressCount">0 / 0</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="items" id="items"></div>

</section>


<section class="stats">

  <div class="stat">
    <div class="stat-number" id="statTasks">0</div>
    <div class="stat-label">Tasks</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="statDone">0</div>
    <div class="stat-label">Done</div>
  </div>

  <div class="stat">
    <div class="stat-number" id="statGoals">0</div>
    <div class="stat-label">Goals</div>
  </div>

</section>

</div>


<nav class="bottom-nav">

  <button class="nav-btn active" data-section="tasks">
    <span class="nav-icon">✓</span>
    Tasks
  </button>

  <button class="nav-btn" data-section="notes">
    <span class="nav-icon">▤</span>
    Notes
  </button>

  <button class="nav-btn" data-section="next">
    <span class="nav-icon">→</span>
    Next
  </button>

  <button class="nav-btn" data-section="goals">
    <span class="nav-icon">◎</span>
    Goals
  </button>

</nav>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">Add Task</h2>

    <form class="form" id="form"></form>

  </div>

</div>


<script>

const STORAGE_KEY = "archon-study-data-v4";

let data = loadData();

let currentSection = "tasks";

let searchTerm = "";


/* ---------------- DATA ---------------- */

function defaultData(){

  return {
    tasks: [],
    notes: [],
    next: [],
    goals: []
  };

}


function loadData(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      return {
        tasks:Array.isArray(parsed.tasks) ? parsed.tasks : [],
        notes:Array.isArray(parsed.notes) ? parsed.notes : [],
        next:Array.isArray(parsed.next) ? parsed.next : [],
        goals:Array.isArray(parsed.goals) ? parsed.goals : []
      };

    }

  }catch(error){

    console.log("Could not load saved data.", error);

  }

  return defaultData();

}


function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.log("Could not save data.", error);

  }

}


/* ---------------- HELPERS ---------------- */

function createId(){

  return Date.now().toString(36) +
         Math.random().toString(36).slice(2);

}


function escapeText(value){

  return String(value ?? "");

}


function filteredItems(){

  const items = data[currentSection];

  if(!searchTerm.trim()) return items;

  const term = searchTerm.toLowerCase();

  return items.filter(item =>
    JSON.stringify(item)
      .toLowerCase()
      .includes(term)
  );

}


/* ---------------- RENDER ---------------- */

function render(){

  renderHeader();

  renderItems();

  renderProgress();

  renderStats();

}


function renderHeader(){

  const labels = {

    tasks:"Today's Task",
    notes:"Study Notes",
    next:"Up Next",
    goals:"Your Goals"

  };

  const titles = {

    tasks:"Execute your priorities.",
    notes:"Capture what matters.",
    next:"Know what comes next.",
    goals:"Build toward something."

  };

  document.getElementById("cardLabel").textContent =
    labels[currentSection];

  document.getElementById("cardTitle").textContent =
    titles[currentSection];

}


function renderItems(){

  const container =
    document.getElementById("items");

  container.innerHTML = "";

  const items = filteredItems();

  if(items.length === 0){

    const empty = document.createElement("div");

    empty.className = "empty";

    empty.textContent =
      searchTerm
      ? "Nothing matches your search."
      : "Nothing here yet. Add something.";

    container.appendChild(empty);

    return;

  }

  items.forEach(item => {

    if(currentSection === "tasks")
      container.appendChild(createTask(item));

    if(currentSection === "notes")
      container.appendChild(createNote(item));

    if(currentSection === "next")
      container.appendChild(createNext(item));

    if(currentSection === "goals")
      container.appendChild(createGoal(item));

  });

}


function createTask(item){

  const row = document.createElement("div");

  row.className =
    "item" + (item.completed ? " completed" : "");

  const check = document.createElement("button");

  check.className = "check";

  check.textContent =
    item.completed ? "✓" : "";

  check.onclick = () => {

    item.completed = !item.completed;

    saveData();

    render();

  };


  const content = document.createElement("div");

  content.className = "item-content";


  const text = document.createElement("div");

  text.className = "item-text";

  text.textContent = item.text;


  content.appendChild(text);


  if(item.created){

    const meta = document.createElement("div");

    meta.className = "item-meta";

    meta.textContent =
      new Date(item.created).toLocaleDateString();

    content.appendChild(meta);

  }


  const del = createDeleteButton(item.id);

  row.append(check,content,del);

  return row;

}


function createNext(item){

  const row = document.createElement("div");

  row.className =
    "item" + (item.completed ? " completed" : "");

  const check = document.createElement("button");

  check.className = "check";

  check.textContent =
    item.completed ? "✓" : "";

  check.onclick = () => {

    item.completed = !item.completed;

    saveData();

    render();

  };


  const content = document.createElement("div");

  content.className = "item-content";


  const text = document.createElement("div");

  text.className = "item-text";

  text.textContent = item.text;

  content.appendChild(text);


  const meta = document.createElement("div");

  meta.className = "item-meta";

  const parts = [];

  if(item.date) parts.push(item.date);

  if(item.priority) parts.push("Priority: " + item.priority);

  meta.textContent = parts.join(" • ");

  content.appendChild(meta);


  const del = createDeleteButton(item.id);

  row.append(check,content,del);

  return row;

}


function createNote(item){

  const row = document.createElement("div");

  row.className = "item note-item";


  const content = document.createElement("div");

  content.className = "item-content";


  const title = document.createElement("div");

  title.className = "note-title";

  title.textContent =
    item.title || "Untitled note";


  const body = document.createElement("div");

  body.className = "note-body";

  body.textContent =
    item.body || "Empty note";


  content.append(title,body);


  const del = createDeleteButton(item.id);

  row.append(content,del);

  return row;

}


function createGoal(item){

  const row = document.createElement("div");

  row.className = "item goal-item";


  const header = document.createElement("div");

  header.className = "goal-header";


  const title = document.createElement("span");

  title.textContent = item.text;


  const percentage = document.createElement("span");

  percentage.textContent =
    (item.progress || 0) + "%";


  header.append(title,percentage);


  const slider = document.createElement("input");

  slider.type = "range";

  slider.min = "0";

  slider.max = "100";

  slider.value = item.progress || 0;

  slider.className = "goal-slider";


  slider.oninput = () => {

    item.progress = Number(slider.value);

    percentage.textContent =
      item.progress + "%";

    saveData();

    renderProgress();

    renderStats();

  };


  const del = createDeleteButton(item.id);

  row.append(header,slider,del);

  return row;

}


function createDeleteButton(id){

  const button = document.createElement("button");

  button.className = "delete";

  button.textContent = "×";

  button.title = "Delete";

  button.onclick = () => {

    if(confirm("Delete this item?")){

      data[currentSection] =
        data[currentSection].filter(
          item => item.id !== id
        );

      saveData();

      render();

    }

  };

  return button;

}


/* ---------------- PROGRESS ---------------- */

function renderProgress(){

  const items = data[currentSection];

  let percentage = 0;

  if(currentSection === "goals"){

    if(items.length){

      percentage =
        Math.round(
          items.reduce(
            (sum,item) =>
              sum + Number(item.progress || 0),
            0
          ) / items.length
        );

    }

  }else{

    const completed =
      items.filter(item => item.completed).length;

    percentage =
      items.length
      ? Math.round((completed / items.length) * 100)
      : 0;

  }


  document.getElementById("progressFill")
    .style.width = percentage + "%";


  document.getElementById("progressText")
    .textContent = percentage + "% complete";


  if(currentSection === "goals"){

    document.getElementById("progressCount")
      .textContent = items.length + " goals";

  }else{

    const completed =
      items.filter(item => item.completed).length;

    document.getElementById("progressCount")
      .textContent =
      completed + " / " + items.length;

  }

}


function renderStats(){

  const tasks = data.tasks;

  const done =
    tasks.filter(item => item.completed).length;

  document.getElementById("statTasks")
    .textContent = tasks.length;

  document.getElementById("statDone")
    .textContent = done;

  document.getElementById("statGoals")
    .textContent = data.goals.length;

}


/* ---------------- SECTION SWITCHING ---------------- */

function setSection(section){

  currentSection = section;

  document.querySelectorAll("[data-section]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.section === section
      );

    });

  render();

}


/* ---------------- MODAL ---------------- */

function openModal(){

  const modal =
    document.getElementById("modal");

  const form =
    document.getElementById("form");

  const title =
    document.getElementById("modalTitle");


  form.innerHTML = "";

  title.textContent =
    "Add " +
    currentSection.charAt(0).toUpperCase() +
    currentSection.slice(1);


  if(currentSection === "tasks"){

    form.appendChild(
      inputField(
        "text",
        "Task",
        "What needs to be done?",
        "taskText"
      )
    );

  }


  if(currentSection === "notes"){

    form.appendChild(
      inputField(
        "text",
        "Title",
        "Note title",
        "noteTitle"
      )
    );

    form.appendChild(
      textareaField(
        "Note",
        "Write your note...",
        "noteBody"
      )
    );

  }


  if(currentSection === "next"){

    form.appendChild(
      inputField(
        "text",
        "Item",
        "What comes next?",
        "nextText"
      )
    );

    form.appendChild(
      inputField(
        "date",
        "Date",
        "",
        "nextDate"
      )
    );


    const select =
      document.createElement("select");

    select.id = "nextPriority";

    ["Low","Medium","High"].forEach(priority => {

      const option =
        document.createElement("option");

      option.value = priority;

      option.textContent =
        priority + " priority";

      select.appendChild(option);

    });

    form.appendChild(select);

  }


  if(currentSection === "goals"){

    form.appendChild(
      inputField(
        "text",
        "Goal",
        "What are you working toward?",
        "goalText"
      )
    );

  }


  const actions =
    document.createElement("div");

  actions.className = "form-actions";


  const cancel =
    document.createElement("button");

  cancel.type = "button";

  cancel.className = "cancel";

  cancel.textContent = "Cancel";

  cancel.onclick = closeModal;


  const save =
    document.createElement("button");

  save.type = "submit";

  save.className = "save";

  save.textContent = "Add";


  actions.append(cancel,save);

  form.appendChild(actions);


  form.onsubmit = saveItem;

  modal.classList.add("show");


  setTimeout(() => {

    const first =
      form.querySelector("input,textarea");

    if(first) first.focus();

  },100);

}


function inputField(type,label,placeholder,id){

  const input =
    document.createElement("input");

  input.type = type;

  input.placeholder = placeholder;

  input.id = id;

  input.setAttribute("aria-label",label);

  return input;

}


function textareaField(label,placeholder,id){

  const textarea =
    document.createElement("textarea");

  textarea.placeholder = placeholder;

  textarea.id = id;

  textarea.setAttribute("aria-label",label);

  return textarea;

}


function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");

}


function saveItem(event){

  event.preventDefault();


  let item = {

    id:createId(),

    created:Date.now(),

    completed:false

  };


  if(currentSection === "tasks"){

    const text =
      document.getElementById("taskText").value.trim();

    if(!text) return;

    item.text = text;

  }


  if(currentSection === "notes"){

    const title =
      document.getElementById("noteTitle").value.trim();

    const body =
      document.getElementById("noteBody").value.trim();

    if(!title && !body) return;

    item.title = title || "Untitled note";

    item.body = body;

  }


  if(currentSection === "next"){

    const text =
      document.getElementById("nextText").value.trim();

    if(!text) return;

    item.text = text;

    item.date =
      document.getElementById("nextDate").value;

    item.priority =
      document.getElementById("nextPriority").value;

  }


  if(currentSection === "goals"){

    const text =
      document.getElementById("goalText").value.trim();

    if(!text) return;

    item.text = text;

    item.progress = 0;

  }


  data[currentSection].unshift(item);

  saveData();

  closeModal();

  render();

}


/* ---------------- SEARCH ---------------- */

document.getElementById("search")
  .addEventListener("input",event => {

    searchTerm =
      event.target.value;

    renderItems();

  });


document.getElementById("clearSearch")
  .onclick = () => {

    const search =
      document.getElementById("search");

    search.value = "";

    searchTerm = "";

    search.focus();

    renderItems();

  };


/* ---------------- BUTTONS ---------------- */

document.getElementById("addButton")
  .onclick = openModal;

document.getElementById("quickAdd")
  .onclick = openModal;


document.querySelectorAll("[data-section]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => setSection(button.dataset.section)
    );

  });


document.getElementById("modal")
  .addEventListener("click",event => {

    if(event.target.id === "modal"){

      closeModal();

    }

  });


/* ---------------- START ---------------- */

render();

</script>

</body>
