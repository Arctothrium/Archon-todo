<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon — Your Study Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1410;
    --cream:#fdf8ef;
    --gold:#f6b93b;
    --gold-deep:#f0932b;
    --orange:#f5871f;
    --orange-deep:#ea6a1f;
    --blue:#3aa0e8;
    --blue-deep:#1f6fd6;
    --pink:#e84c8a;
    --panel-radius: 26px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    overflow-x:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  /* Header */
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 20px;
    background:#fff;
    border-bottom:1px solid #f0e9db;
  }
  .logo-mark{
    width:30px;height:30px;position:relative;flex-shrink:0;
  }
  .logo-mark svg{width:100%;height:100%;display:block;}
  .brand{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.2px;
  }
  /* Hero */
  .hero{
    position:relative;
    padding:34px 20px 34px;
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 45%, var(--orange) 100%);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    right:-60px; bottom:-90px;
    width:220px;height:220px;
    background:var(--cream);
    border-radius:50%;
    opacity:0.9;
  }
  .hero-top{
    display:flex;
    justify-content:flex-end;
    gap:16px;
    position:relative;
    z-index:2;
    margin-bottom:10px;
  }
  .icon-btn{
    background:none;border:none;cursor:pointer;
    color:#241a10;
    display:flex;align-items:center;justify-content:center;
    padding:4px;
    opacity:0.85;
    transition:opacity .15s, transform .15s;
  }
  .icon-btn:hover{opacity:1; transform:translateY(-1px);}
  .icon-btn.active{opacity:1;}
  .icon-btn svg{width:22px;height:22px;}
  h1.hero-title{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:38px;
    line-height:1.08;
    margin:2px 0 8px;
    position:relative;
    z-index:2;
    max-width:78%;
  }
  .hero-sub{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:16px;
    margin:0 0 20px;
    position:relative;
    z-index:2;
    color:#2b1e10;
  }
  .search-wrap{
    position:relative;
    z-index:2;
  }
  .search-wrap input{
    width:100%;
    border:none;
    outline:none;
    background:#fffdf9;
    border-radius:999px;
    padding:15px 20px 15px 46px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:#3a2c18;
    box-shadow:0 6px 18px rgba(80,40,0,0.12);
  }
  .search-wrap input::placeholder{color:#a89a82;}
  .search-wrap svg{
    position:absolute;
    left:16px; top:50%;
    transform:translateY(-50%);
    width:18px;height:18px;
    color:#a89a82;
  }
  /* Outlayer section */
  .outlayer{
    position:relative;
    padding:32px 20px 40px;
    background:radial-gradient(circle at 85% 30%, #6cc4f0 0%, #bfe4f9 35%, var(--cream) 68%);
    overflow:hidden;
  }
  h2.section-title{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-size:34px;
    margin:0 0 22px;
    position:relative;
    z-index:2;
  }
  .card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    position:relative;
    z-index:2;
  }
  .nav-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg, #ffce6b, var(--gold-deep));
    border:none;
    border-radius:999px;
    padding:8px 8px 8px 6px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    box-shadow:0 6px 14px rgba(200,120,0,0.18);
    transition:transform .15s, box-shadow .15s;
  }
  .nav-card:active{transform:scale(0.97);}
  .nav-card.selected{
    outline:2px solid #241a10;
    outline-offset:2px;
  }
  .nav-card .pill-label{
    background:var(--cream);
    border-radius:999px;
    padding:12px 18px;
    font-weight:600;
    font-size:14px;
    color:#3a2c18;
    flex:1;
    text-align:left;
  }
  .nav-card .chev{
    width:20px;height:20px;
    margin:0 8px;
    color:#3a2c18;
    flex-shrink:0;
  }
  /* Today's task list section */
  .list-section{
    position:relative;
    padding:34px 20px 50px;
    background:
      radial-gradient(circle at 10% 15%, rgba(232,76,138,0.55) 0%, rgba(232,76,138,0) 45%),
      radial-gradient(circle at 90% 85%, rgba(245,135,31,0.7) 0%, rgba(245,135,31,0) 45%),
      linear-gradient(160deg, #12141c 0%, #1f3a63 45%, var(--blue-deep) 100%);
    min-height:340px;
    overflow:hidden;
  }
  .list-section::after{
    content:"";
    position:absolute;
    right:-80px; bottom:-100px;
    width:260px;height:260px;
    background:radial-gradient(circle, var(--orange) 0%, var(--gold) 55%, transparent 75%);
    border-radius:50%;
    opacity:0.9;
  }
  .list-section h2{
    color:var(--cream);
    position:relative;
    z-index:2;
  }
  .task-rows{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .task-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fdf8ef;
    border-radius:999px;
    padding:10px 14px;
    box-shadow:0 6px 14px rgba(0,0,0,0.18);
    position:relative;
  }
  .task-check{
    width:22px;height:22px;
    border-radius:50%;
    border:2px solid #cbb98f;
    background:#fff;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .task-check.done{
    background:var(--orange-deep);
    border-color:var(--orange-deep);
  }
  .task-check svg{width:13px;height:13px;color:#fff; display:none;}
  .task-check.done svg{display:block;}
  .task-text{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    text-align:center;
    color:#241a10;
    padding:4px 2px;
  }
  .task-text::placeholder{
    color:#9c9082;
    font-weight:600;
  }
  .task-row.done .task-text{
    text-decoration:line-through;
    color:#a89a82;
  }
  .task-del{
    background:none;
    border:none;
    color:#c7b8a0;
    cursor:pointer;
    font-size:18px;
    line-height:1;
    padding:2px 4px;
    flex-shrink:0;
    opacity:0;
    transition:opacity .15s;
  }
  .task-row:hover .task-del,
  .task-row:focus-within .task-del{opacity:1;}
  .empty-hint{
    position:relative;
    z-index:2;
    color:#d8cdb8;
    font-size:13px;
    margin-top:14px;
    text-align:center;
  }
  footer.tab-bar{
    display:flex;
    justify-content:space-around;
    background:#fff;
    border-top:1px solid #f0e9db;
    padding:12px 10px 18px;
  }
  .tab-btn{
    background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:#b8ab92;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    transition:color .15s;
  }
  .tab-btn svg{width:20px;height:20px;}
  .tab-btn.selected{color:var(--orange-deep);}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="logo-mark">
      <svg viewBox="0 0 30 30" fill="none">
        <path d="M15 2 L26 22 L15 17 Z" fill="#f0932b"/>
        <path d="M15 2 L4 22 L15 17 Z" fill="#f6b93b"/>
        <path d="M15 17 L26 22 L15 28 L4 22 Z" fill="#241a10"/>
      </svg>
    </div>
    <div class="brand">Archon</div>
  </header>

  <section class="hero">
    <div class="hero-top">
      <button class="icon-btn active" title="Home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      </button>
      <button class="icon-btn" title="Notes" aria-label="Notes" data-goto="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5C6 3.5 9 3.5 12 4.5c3-1 6-1 8 0v15c-2-1-5-1-8 0-3-1-6-1-8 0Z"/><path d="M12 4.5v15"/></svg>
      </button>
      <button class="icon-btn" title="Tasks" aria-label="Tasks" data-goto="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 12h6M9 16h4"/></svg>
      </button>
      <button class="icon-btn" title="Add task" aria-label="Add task" id="quickAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <h1 class="hero-title">Your Study Command Center</h1>
    <p class="hero-sub">Organise. Focus. Execute.</p>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Search Tasks, Notes...">
    </div>
  </section>

  <section class="outlayer">
    <h2 class="section-title">Outlayer<span style="font-weight:400;">.</span></h2>
    <div class="card-grid">
      <button class="nav-card" data-list="notes">
        <span class="pill-label">Notes</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="nav-card selected" data-list="tasks">
        <span class="pill-label">Tasks</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="nav-card" data-list="next">
        <span class="pill-label">Next</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="nav-card" data-list="goals">
        <span class="pill-label">Goals</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <section class="list-section" id="listSection">
    <h2 class="section-title" id="listTitle">Today's Task</h2>
    <div class="task-rows" id="taskRows"></div>
    <div class="empty-hint" id="emptyHint" style="display:none;">Nothing here yet — start typing above.</div>
  </section>

  <footer class="tab-bar">
    <button class="tab-btn selected" data-list="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
      Tasks
    </button>
    <button class="tab-btn" data-list="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5C6 3.5 9 3.5 12 4.5c3-1 6-1 8 0v15c-2-1-5-1-8 0-3-1-6-1-8 0Z"/></svg>
      Notes
    </button>
    <button class="tab-btn" data-list="next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Next
    </button>
    <button class="tab-btn" data-list="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>
      Goals
    </button>
  </footer>

</div>

<script>
(function(){
  const LISTS = ['tasks','notes','next','goals'];
  const TITLES = { tasks:"Today's Task", notes:"Your Notes", next:"Coming Up Next", goals:"Your Goals" };
  const PLACEHOLDERS = {
    tasks:"Type here to set task",
    notes:"Type here to add a note",
    next:"Type here to plan what's next",
    goals:"Type here to set a goal"
  };

  let currentList = 'tasks';
  let data = { tasks:[], notes:[], next:[], goals:[] };
  let searchTerm = '';
  let storageReady = true;

  const rowsEl = document.getElementById('taskRows');
  const titleEl = document.getElementById('listTitle');
  const emptyHint = document.getElementById('emptyHint');
  const searchInput = document.getElementById('searchInput');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  async function loadAll(){
    for(const key of LISTS){
      try{
        const raw = localStorage.getItem('archon:'+key);
        if(raw){
          data[key] = JSON.parse(raw);
        }
      }catch(e){
        // key not found yet or storage unavailable — keep default empty list
      }
    }
    render();
  }

  async function saveList(key){
    try{
      localStorage.setItem('archon:'+key, JSON.stringify(data[key]));
    }catch(e){
      storageReady = false;
      console.error('Storage save failed', e);
    }
  }

  function ensureTrailingBlank(){
    const list = data[currentList];
    const last = list[list.length-1];
    if(!last || last.text.trim() !== ''){
      list.push({ id: uid(), text:'', done:false });
    }
  }

  function render(){
    titleEl.textContent = TITLES[currentList];
    document.querySelectorAll('.nav-card').forEach(c=>{
      c.classList.toggle('selected', c.dataset.list === currentList);
    });
    document.querySelectorAll('.tab-btn').forEach(c=>{
      c.classList.toggle('selected', c.dataset.list === currentList);
    });

    ensureTrailingBlank();

    const list = data[currentList];
    const term = searchTerm.trim().toLowerCase();
    const visible = list.filter(item => !term || item.text.toLowerCase().includes(term) || item.text.trim()==='');

    rowsEl.innerHTML = '';
    let anyFilled = false;

    visible.forEach(item=>{
      if(item.text.trim() !== '') anyFilled = true;
      const row = document.createElement('div');
      row.className = 'task-row' + (item.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'task-check' + (item.done ? ' done' : '');
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      check.addEventListener('click', ()=>{
        item.done = !item.done;
        saveList(currentList);
        render();
      });

      const input = document.createElement('input');
      input.className = 'task-text';
      input.type = 'text';
      input.placeholder = PLACEHOLDERS[currentList];
      input.value = item.text;
      input.addEventListener('input', (e)=>{
        item.text = e.target.value;
      });
      input.addEventListener('blur', ()=>{
        item.text = item.text.trim();
        saveList(currentList);
        render();
      });
      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.target.blur();
        }
      });

      const del = document.createElement('button');
      del.className = 'task-del';
      del.setAttribute('aria-label','Delete');
      del.textContent = '\u00d7';
      del.addEventListener('click', ()=>{
        data[currentList] = data[currentList].filter(x=>x.id !== item.id);
        saveList(currentList);
        render();
      });

      row.appendChild(check);
      row.appendChild(input);
      if(item.text.trim() !== ''){
        row.appendChild(del);
      }
      rowsEl.appendChild(row);
    });

    emptyHint.style.display = (term && !anyFilled) ? 'block' : 'none';
  }

  document.querySelectorAll('.nav-card, .tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentList = btn.dataset.list;
      render();
      document.getElementById('listSection').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  document.querySelectorAll('[data-goto]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentList = btn.dataset.goto;
      render();
      document.getElementById('listSection').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  document.getElementById('quickAdd').addEventListener('click', ()=>{
    currentList = 'tasks';
    render();
    document.getElementById('listSection').scrollIntoView({behavior:'smooth', block:'start'});
    setTimeout(()=>{
      const inputs = rowsEl.querySelectorAll('.task-text');
      if(inputs.length) inputs[inputs.length-1].focus();
    }, 350);
  });

  searchInput.addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    render();
  });

  loadAll();
})();
</script>
</body>
</html>
